# ========== PostgreSQL Configuration ==========
spring.datasource.url=jdbc:postgresql://localhost:5432/mudda_test
spring.datasource.username=vikas
spring.datasource.password=vikas1612

# DDL: create schema on start, drop on stop
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ======= Server =======
server.port=0

# ======= Security (fixed, short-lived for speed) =======
security.jwt.secret-key=dGVzdC1qd3Qtc2VjcmV0LWtleS0zMmJ5dGVzLWxvbmcxMjM0NTY=
security.jwt.access-ttl-min=60
security.jwt.refresh-ttl-days=7

# ========== Flyway ==========
spring.flyway.enabled=true
spring.flyway.schemas=flyway_history, public, civic
spring.flyway.default-schema=flyway_history
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ======= App =======
app.frontend-base-url=http://localhost:3000
app.token.resend-cooldown-minutes=5
app.token.verification-expiry-hours=24
app.security.login.max-attempts=5
app.security.login.lock-duration-minutes=15
app.cors.allowed-origins=http://localhost:3000
app.session.key=dGVzdC1qd3Qtc2VjcmV0LWtleS0zMmJ5dGVzLWxvbmcxMjM0NTY=

# ======= AWS (mocked via @MockBean values only need to be non-blank) =======
amazon.s3.bucket-name=test-bucket
amazon.s3.region=ap-south-1
amazon.s3.access-key=DUMMY_KEY
amazon.s3.secret-key=DUMMY_SECRET
spring.cloud.aws.region.static=ap-south-1
spring.cloud.aws.sqs.queue-not-found-strategy=fail

# ======= Mail (mocked via @MockBean) =======
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.test-connection=false

spring.cloud.aws.sqs.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.mail.autoconfigure.MailSenderValidatorAutoConfiguration
